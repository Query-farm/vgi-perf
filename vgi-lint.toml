# vgi-lint-check configuration for the vgi-perf worker.
#
# Every metadata rule AND every execution rule gates at `--fail-on info`, with no
# rule suppressed. The five decode table functions take a `src` that is a path to
# a perf.data file OR a BLOB of its bytes; the object-level example_queries /
# executable_examples and the agent_test_tasks all pass an EMBEDDED synthetic
# capture via `from_hex(...)` (see meta::FIXTURE_HEX), so the VGI9xx execution
# rules (VGI901/902/906/907/910/911) run for real against the live worker inside
# the lint sandbox — no external file, network, or credential needed. The headline
# ip↔mmap range join and the batch-boundary scan-state resume are additionally
# exercised against the committed fixtures by the haybarn SQLLogic E2E
# (test/sql/*.test, `make test-sql`).
[tool.vgi-lint-check]
location = "target/release/perf-worker"
select = ["ALL"]
fail_on = "info"

[tool.vgi-lint-check.options]
column_comment_min_ratio = 0.8
