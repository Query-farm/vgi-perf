[project]
name = "vgi-perf-notebooks"
version = "0.2.0"
description = "Callchain depth and self versus inclusive sample accounting"
requires-python = ">=3.11,<3.15"
dependencies = [
    "vgi-example-notebooks[runner] @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.3.14",
]

[tool.ruff]
builtins = ["capture_meta", "event_table", "mapping_table", "comparison"] # JupySQL result captures
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"] # Visible SQL and result-derived prose retain readable lines
