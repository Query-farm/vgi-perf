# Private graders for the agent-suitability suite (`vgi-lint simulate`).
#
# The prompts are published in the catalog's vgi.agent_test_tasks tag
# (crates/perf-worker/src/lib.rs); the canonical answers live here, keyed by
# task name, so the agent being graded never sees them (VGI416). The BLOB is
# the committed synthetic fixture data/callchain.data (meta::FIXTURE_HEX).
# vgi-lint discovers this file in the directory it runs from.

tasks:
  - name: sample_count
    reference_sql: "SELECT count(*) AS n FROM perf.main.samples(from_hex(''))"
  - name: event_policy
    reference_sql: "SELECT type, sample_period FROM perf.main.events(from_hex(''))"
  - name: event_record_total
    reference_sql: "SELECT total_events FROM perf.main.meta(from_hex(''))"
  - name: mapped_files_build_ids
    reference_sql: "SELECT filename, build_id FROM perf.main.mmaps(from_hex('')) ORDER BY filename"
  - name: process_name
    reference_sql: "SELECT comm FROM perf.main.comms(from_hex(''))"
  - name: browse_decode_functions
    reference_sql: "SELECT object_name, result_columns FROM perf.main.functions WHERE object_kind = 'table function' ORDER BY object_name"
