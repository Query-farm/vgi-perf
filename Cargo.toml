[workspace]
resolver = "2"
members = ["crates/perf-core", "crates/perf-worker", "crates/perf-wasm"]
# perf-wasm only makes sense for wasm32-unknown-emscripten (it is a staticlib
# whose ring ops are supplied by emcc's --js-library), so keep it out of the
# default set: bare `cargo build` / `test` / `clippy` stay native-only and
# unchanged. Build it explicitly with `wasm/build.sh` or `-p perf-wasm`.
default-members = ["crates/perf-core", "crates/perf-worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Query Farm LLC <hello@query.farm>"]
repository = "https://github.com/Query-farm/vgi-perf"

[workspace.dependencies]
# VGI Rust SDK (worker side). 0.24 provides the wasm `vgi::wasm_worker!` macro
# used by perf-wasm; requires rustc 1.97 (see rust-version above). Base
# (feature-less) so each target can opt in: the native build takes the SDK's real
# defaults (`sqlite` + `transport-http`), while the wasm build must NOT —
# tokio/mio/axum and bundled SQLite do not compile for wasm32, and the browser
# transport serves over a byte channel rather than HTTP. Features are additive,
# and the two are behind mutually-exclusive target cfgs.
vgi = { version = "0.24", default-features = false }
vgi-rpc = { version = "0.23", default-features = false, features = ["macros"] }
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"

# perf.data binary decode stack (mstange — the same parser behind the Firefox
# profiler). MIT/Apache-2.0, fully permissive. `zstd` enables transparent
# decompression of records in captures with a compressed PERF_RECORD_COMPRESSED.
linux-perf-data = "0.13"
linux-perf-event-reader = "0.10"

# The pure-Rust core crate, consumed by the worker.
perf-core = { path = "crates/perf-core", version = "0.1.0" }

[profile.release]
opt-level = 2
# Strip symbols + debug info from the release binary. The worker has no need for
# in-binary backtraces in production; build a debug profile locally for symbols.
strip = true
